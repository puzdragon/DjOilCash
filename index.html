<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>온통대전 주유소 가격 지도</title>
<style>
:root{--g:#0f8a5f;--gd:#0a6646;--gl:#e7f5ee;--ink:#1d2421;--mute:#6b746f;--line:#e3e8e5;--low:#e03131}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;font:14px/1.45 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:#f4f7f5}
#app{display:grid;grid-template-columns:380px 1fr;height:100%}
#side{display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);overflow:hidden}
header{background:var(--g);color:#fff;padding:16px 16px 14px}
header h1{margin:0;font-size:20px;letter-spacing:-.3px}
header p{margin:4px 0 0;font-size:12px;opacity:.85}
.ctl{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.search{display:flex;border:1.5px solid var(--g);border-radius:10px;overflow:hidden}
.search input{flex:1;border:0;padding:10px 12px;font-size:15px;outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#f1f4f2;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
.row select{font-size:13px;padding:4px 6px;border-radius:6px;border:1px solid var(--line)}
#list{flex:1;overflow-y:auto}
.it{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.it:hover,.it.on{background:var(--gl)}
.no{width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.no.lpg{background:#1c7ed6}
.nm{font-weight:700}.ad{font-size:12px;color:var(--mute)}
.pr{text-align:right;font-weight:800;font-size:16px;white-space:nowrap}
.pr small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.pr.low{color:var(--low)}
.pr.na{color:#adb5bd;font-weight:400;font-size:12px}
#map{position:relative}
#mapEl{position:absolute;inset:0}
#err{position:absolute;inset:0;display:none;place-items:center;padding:30px;text-align:center;background:#fff;color:var(--mute)}
.bub{position:relative;background:#fff;border:2px solid var(--g);border-radius:8px;padding:2px 7px;font-weight:800;font-size:12px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer;transform:translateY(-8px)}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--g);border-bottom:0}
.bub.lpg{border-color:#1c7ed6}.bub.lpg::after{border-top-color:#1c7ed6}
.bub.low{background:var(--low);border-color:var(--low);color:#fff}.bub.low::after{border-top-color:var(--low)}
.bub.sel{z-index:10;outline:3px solid #ffd43b}
.bub.cand{border-style:dashed;border-color:#868e96;color:#495057}.bub.cand::after{border-top-color:#868e96}
.no.cand{background:#adb5bd}
.tag{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
.tag.v{background:var(--gl);color:var(--gd)}.tag.c{background:#f1f3f5;color:#868e96}
.card{position:absolute;left:12px;right:12px;bottom:12px;max-width:420px;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.2);padding:14px 16px;display:none;z-index:5}
.card h3{margin:0 0 2px;font-size:16px}
.card .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--mute)}
.card table{width:100%;border-collapse:collapse;margin:8px 0}
.card td{padding:3px 0;border-bottom:1px solid var(--line)}
.card td:last-child{text-align:right;font-weight:700}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns a{flex:1;text-align:center;padding:9px 6px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:700}
.k{background:#fee500;color:#191919}.n{background:#03c75a;color:#fff}
.note{font-size:11px;color:var(--mute);padding:8px 14px;border-top:1px solid var(--line)}
@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:52vh 1fr}#map{grid-row:1}#side{grid-row:2;border-right:0}header{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header>
      <h1>온통대전 주유소 가격 지도</h1>
      <p id="upd">가격 정보 불러오는 중…</p>
    </header>
    <div class="ctl">
      <div class="search"><input id="q" type="search" placeholder="주유소명 또는 주소 검색"></div>
      <div class="chips" id="gu"></div>
      <div class="chips" id="stat">
        <button class="chip on" data-s="all">전체</button>
        <button class="chip" data-s="verified">캐시백 확인됨</button>
        <button class="chip" data-s="candidate">미확인 후보</button>
      </div>
      <div class="chips" id="fuel">
        <button class="chip on" data-f="gasoline">휘발유</button>
        <button class="chip" data-f="diesel">경유</button>
        <button class="chip" data-f="lpg">LPG</button>
      </div>
      <div class="row"><span id="cnt"></span>
        <select id="sort"><option value="price">가격 낮은 순</option><option value="name">이름 순</option></select></div>
    </div>
    <div id="list"></div>
    <div class="note">가격: 오피넷(한국석유공사) · 후보 목록: 대전시 온통대전 신청 가맹점 API<br>초록 = 캐시백 확인됨, 회색 점선 = 온통대전 가맹점이지만 캐시백 미확인(연매출 30억 초과 시 미지급). 결제 전 매장에서 확인하세요.</div>
  </div>
  <div id="map">
    <div id="mapEl"></div>
    <div id="err">카카오 지도를 불러오지 못했습니다.<br>카카오 개발자 콘솔 › 앱 › 플랫폼 › Web에<br>지금 주소(예: http://localhost:8080)가 등록돼 있는지 확인하세요.</div>
    <div class="card" id="card"></div>
  </div>
</div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ea0729ae6a4d26b29ed19bb05c5c4be1&autoload=false"></script>
<script>
{
const FUEL={gasoline:'휘발유',diesel:'경유',lpg:'LPG',premium:'고급휘발유'};
const BRAND={SKE:'SK에너지',GSC:'GS칼텍스',HDO:'HD현대오일뱅크',SOL:'S-OIL',RTE:'알뜰',RTX:'고속도로알뜰',NHO:'농협알뜰',ETC:'자가상표',E1G:'E1',SKG:'SK가스',RTO:'자영알뜰'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>n?n.toLocaleString('ko-KR')+'원':'';
let S=[],P={},st={gu:'전체',stat:'all',fuel:'gasoline',q:'',sort:'price',sel:null};
const GU_ORDER=['동구','중구','서구','유성구','대덕구'];
let map,ovs={};

const priceOf=s=>(P[s.id]||{})[st.fuel];
function visible(){
  const q=st.q.trim();
  let v=S.filter(s=>(st.gu==='전체'||s.gu===st.gu)&&(st.stat==='all'||s.status===st.stat)&&(!q||s.name.includes(q)||s.addr.includes(q)||(s.ontong_name||'').includes(q)));
  v.sort((a,b)=>st.sort==='name'?a.name.localeCompare(b.name,'ko'):(priceOf(a)||1e9)-(priceOf(b)||1e9));
  return v;
}
function lowSet(v){const ps=v.map(priceOf).filter(Boolean).sort((a,b)=>a-b);const cut=ps[Math.min(2,ps.length-1)];return p=>p&&p<=cut;}

function render(){
  const v=visible(),isLow=lowSet(v),withP=v.filter(priceOf).length;
  document.getElementById('cnt').textContent=`${v.length}곳 · ${FUEL[st.fuel]} 가격 ${withP}곳`;
  document.getElementById('list').innerHTML=v.map((s,i)=>{const p=priceOf(s),cand=s.status==='candidate';
    return `<div class="it${st.sel===s.id?' on':''}" data-id="${esc(s.id)}"><div class="no${cand?' cand':s.lpg?' lpg':''}">${i+1}</div>
    <div><div class="nm">${esc(s.name)}<span class="tag ${cand?'c':'v'}">${cand?'미확인':'캐시백'}</span></div><div class="ad">${esc(s.addr.replace('대전 ',''))}</div></div>
    <div class="pr${p?(isLow(p)?' low':''):' na'}">${p?won(p):'정보 없음'}${p?`<small>${FUEL[st.fuel]}</small>`:''}</div></div>`}).join('');
  if(!map)return;
  const ids=new Set(v.map(s=>s.id));
  S.forEach(s=>{const o=ovs[s.id];if(!o)return;
    if(!ids.has(s.id)){o.setMap(null);return}
    const p=priceOf(s),el=o.getContent();
    el.className='bub'+(s.status==='candidate'?' cand':s.lpg?' lpg':'')+(p&&isLow(p)?' low':'')+(st.sel===s.id?' sel':'');
    el.textContent=p?p.toLocaleString('ko-KR'):s.name.replace(/\(주\)|㈜/g,'').slice(0,6);
    o.setZIndex(st.sel===s.id?10:(p&&isLow(p)?5:1));o.setMap(map);});
}

function select(id,pan){
  const s=S.find(x=>String(x.id)===String(id));if(!s)return;st.sel=s.id;const p=P[s.id]||{};
  if(map&&pan){map.setLevel(Math.min(map.getLevel(),4));map.panTo(new kakao.maps.LatLng(s.lat,s.lng));}
  const rows=['gasoline','diesel','lpg','premium'].filter(k=>p[k]).map(k=>`<tr><td>${FUEL[k]}</td><td>${won(p[k])}</td></tr>`).join('');
  const kk=`https://map.kakao.com/link/to/${encodeURIComponent(s.name)},${s.lat},${s.lng}`;
  const nv=`https://map.naver.com/p/search/${encodeURIComponent(s.addr)}`;
  const c=document.getElementById('card');
  c.innerHTML=`<button class="x" aria-label="닫기">×</button><h3>${esc(s.name)}</h3>
   <div class="ad">${esc(s.addr)}${p.brand?' · '+esc(BRAND[p.brand]||p.brand):''}${p.tel?' · '+esc(p.tel):''}</div>
   <div class="ad">${s.status==='candidate'?'온통대전 가맹점 목록에 있음 · 캐시백 적립 여부 미확인':'캐시백 적립 확인된 주유소'}${s.ontong_name&&s.ontong_name!==s.name?' · 가맹점명: '+esc(s.ontong_name):''}</div>
   ${rows?`<table>${rows}</table>`:'<p class="ad">가격 정보가 없습니다.</p>'}
   <div class="btns"><a class="k" href="${kk}" target="_blank">카카오맵 길찾기</a><a class="n" href="${nv}" target="_blank">네이버지도</a></div>`;
  c.style.display='block';c.querySelector('.x').onclick=()=>{c.style.display='none';st.sel=null;render();};
  render();
  const li=[...document.querySelectorAll('.it')].find(x=>x.dataset.id===String(id));if(li)li.scrollIntoView({block:'nearest'});
}

function initMap(){
  map=new kakao.maps.Map(document.getElementById('mapEl'),{center:new kakao.maps.LatLng(36.34,127.34),level:7});
  map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);
  const b=new kakao.maps.LatLngBounds();
  S.forEach(s=>{const pos=new kakao.maps.LatLng(s.lat,s.lng);b.extend(pos);
    const el=document.createElement('div');el.className='bub';el.onclick=()=>select(s.id,false);
    ovs[s.id]=new kakao.maps.CustomOverlay({position:pos,content:el,yAnchor:1});});
  map.setBounds(b);render();
}

async function boot(){
  const upd=document.getElementById('upd');
  try{const m=await fetch('data/map.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()});
    S=m.stations;S.forEach(s=>{P[s.id]=Object.assign({brand:s.brand,tel:s.tel},s.prices)});
    upd.textContent=`가격 기준: ${m.updated} (오피넷) · 확인됨 ${m.counts.verified} · 미확인 ${m.counts.candidate}`;}
  catch(e){ // map.json이 아직 없으면 예전 파일로 표시
    S=(await fetch('stations.json').then(r=>r.json())).map(s=>Object.assign(s,{status:'verified'}));
    try{const pr=await fetch('prices.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()});
      P=pr.prices||{};upd.textContent=`가격 기준: ${pr.updated} (오피넷)`;}
    catch(e2){upd.textContent='가격 정보 없음';}}
  const gus=['전체',...GU_ORDER.filter(g=>S.some(s=>s.gu===g))];
  document.getElementById('gu').innerHTML=gus.map(g=>`<button class="chip${g==='전체'?' on':''}" data-g="${g}">${g} ${g==='전체'?S.length:S.filter(s=>s.gu===g).length}</button>`).join('');
  document.getElementById('gu').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;st.gu=b.dataset.g;
    document.querySelectorAll('#gu .chip').forEach(x=>x.classList.toggle('on',x===b));render();};
  document.getElementById('stat').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;st.stat=b.dataset.s;
    document.querySelectorAll('#stat .chip').forEach(x=>x.classList.toggle('on',x===b));render();};
  document.getElementById('fuel').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;st.fuel=b.dataset.f;
    document.querySelectorAll('#fuel .chip').forEach(x=>x.classList.toggle('on',x===b));render();if(st.sel)select(st.sel,false);};
  document.getElementById('q').oninput=e=>{st.q=e.target.value;render();};
  document.getElementById('sort').onchange=e=>{st.sort=e.target.value;render();};
  document.getElementById('list').onclick=e=>{const it=e.target.closest('.it');if(it)select(it.dataset.id,true);};
  render();
  if(window.kakao&&kakao.maps){kakao.maps.load(initMap);}else{document.getElementById('err').style.display='grid';}
}
boot();
}
</script>
</body>
</html>
