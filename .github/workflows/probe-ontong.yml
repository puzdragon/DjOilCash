name: Probe Ontong API (temporary)
on:
  push:
    branches: [claude/ontong-api]
    paths: [.github/workflows/probe-ontong.yml, scripts/fetch_ontong.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch candidates
        run: |
          mkdir -p probe
          python scripts/fetch_ontong.py probe/ontong_candidates.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probe
          git commit -m "probe: Ontong API sample" || true
          git push
