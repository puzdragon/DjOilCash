name: probe-nmcs
on: { push: { branches: [claude/project-thread-rctx5m] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 60 -A "Mozilla/5.0" -o p.html -w "code %{http_code} size %{size_download}\n" https://cdn.nmcs.co.kr/zdata/merchant/20260331/daejeon_market_list.html
          curl -sSI -m 30 https://cdn.nmcs.co.kr/zdata/merchant/20260331/daejeon_market_list.html | grep -i "last-modified\|content-length"
          for d in 20261001 20260930 20261101 20260401 20250331; do echo "$d $(curl -s -o /dev/null -w %{http_code} https://cdn.nmcs.co.kr/zdata/merchant/$d/daejeon_market_list.html)"; done
          python3 - <<'PY'
          import re,json
          s=open('p.html',encoding='utf-8').read()
          i=s.find('"name"')
          print("=== TEXT BEFORE DATA ==="); print(re.sub(r'\s+',' ',re.sub(r'<style.*?</style>','',s[:i],flags=re.S))[:4000])
          print("=== AFTER DATA (script) ==="); j=s.rfind('"category"'); print(s[j:j+3000])
          rows=re.findall(r'\{\s*"name":\s*"(.*?)",\s*"bizno":\s*"(.*?)",\s*"address":\s*"(.*?)",\s*"category":\s*"(.*?)"\s*\}',s,re.S)
          print("TOTAL ROWS",len(rows))
          from collections import Counter
          print(Counter(r[3] for r in rows).most_common(15))
          g=[r for r in rows if r[3].startswith('주유소')]
          print("GAS",len(g))
          for r in g: print("|".join(r))
          PY
